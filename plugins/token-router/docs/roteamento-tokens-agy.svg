<text x="60" y="717" font-size="10.8" font-weight="bold" fill="#1a2230" text-anchor="start">GATE OBRIGATÓRIO DE CONSOLIDAÇÃO: Todo trabalho de executor local é NÃO REVISADO por definição -&gt; Revisar diff/proveniência (revisar-trabalho-ollama.py / forense_custodia) antes de integrar.</text>
<rect x="30" y="755" width="1220" height="60" rx="4" fill="#f4f6fa" stroke="#d6dbe4" stroke-width="1"/>
<text x="44" y="775" font-size="11.2" font-weight="bold" fill="#1a2230" text-anchor="start">REGRAS DE COMANDO EM ESCADA (ATUALIZADO EM 28/10/2026):</text>
<text x="405" y="775" font-size="10.8" font-weight="normal" fill="#1a2230" text-anchor="start">1) Cérebro em Escada: Gemini 4 Argon -&gt; Claude Opus.  2) Agentes Rápidos em Escada: Gemini 3.8 Flash -&gt; Claude Sonnet (SEM limite de arquivo).</text>
<text x="44" y="797" font-size="10.8" font-weight="normal" fill="#4a5364" text-anchor="start">3) Agentes Rápidos podem distribuir tarefas aos modelos locais quando o Cérebro demandar.  4) Exclusão mútua Ollama: Qwen Code (36 GB) e OpenCode (25 GB) nunca rodam juntos.</text>
