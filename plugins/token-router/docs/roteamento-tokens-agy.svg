<text x="372" y="175" font-size="11.8" font-weight="bold" fill="#1a2230" text-anchor="start">1. Cérebro em Escada (Decisão &amp; Comando)</text>
<rect x="682.42171875" y="161" width="[redacted-phone]" height="18" rx="3" fill="#0072B2" stroke="none"/>
<text x="719.7108593749999" y="173" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ARGON -&gt; OPUS</text>
<text x="372" y="203" font-size="10.6" font-weight="bold" fill="#0072B2" text-anchor="start">Escada do Cérebro: 1º Gemini 4 Argon -&gt; 2º Claude Opus</text>
<text x="372" y="220" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">Exclusivo: Arquitetura, trade-offs, redacao-forense</text>
<text x="372" y="237" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">Ação Direta: &lt;= 2 arquivos conhecidos (edição rápida)</text>
<text x="372" y="254" font-size="10.6" font-weight="bold" fill="#1a2230" text-anchor="start">Comando Local: Demanda distribuição aos modelos locais</text>
<text x="372" y="271" font-size="10.6" font-weight="bold" fill="#D55E00" text-anchor="start">PROTEÇÃO DA JANELA DO CÉREBRO (Proibido ler direto):</text>
<text x="372" y="288" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">• Varredura &gt; 3 arquivos brutos -&gt; Delegar Camada 2</text>
<text x="372" y="305" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">• Arquivos/logs volumosos -&gt; Delegar Camada 2</text>
<text x="372" y="322" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">• Acervo documental bruto -&gt; Delegar Camada 2/3</text>
<rect x="870" y="155" width="365" height="205" rx="4" fill="#ffffff" stroke="#56B4E9" stroke-width="2.0" stroke-dasharray="8 3"/>
<rect x="870" y="155" width="365" height="30" rx="4" fill="#eef8fd" stroke="#56B4E9" stroke-width="1"/>
<text x="882" y="175" font-size="11.8" font-weight="bold" fill="#1a2230" text-anchor="start">2. Agentes Rápidos em Escada</text>
<rect x="1132.556328125" y="161" width="94.443671875" height="18" rx="3" fill="#56B4E9" stroke="none"/>
<text x="1179.7781640624999" y="173" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">FLASH 3.8 -&gt; SONNET</text>
<text x="882" y="203" font-size="10.6" font-weight="bold" fill="#0072B2" text-anchor="start">Escada Rápida: 1º Gemini 3.8 Flash -&gt; 2º Claude Sonnet</text>
<text x="882" y="220" font-size="10.6" font-weight="bold" fill="#009E73" text-anchor="start">CAPACIDADE DE LEITURA: SEM LIMITE de tamanho de arquivo!</text>
<text x="882" y="237" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• Lê arquivos, logs e CSVs de qualquer extensão/linhas</text>
<text x="882" y="254" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• Varre codebase (&gt; 3 arquivos) e extrai anomalias</text>
<text x="882" y="271" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">• Devolve síntese limpa (1-3 parágrafos) ao Cérebro</text>
<text x="882" y="288" font-size="10.6" font-weight="bold" fill="#0072B2" text-anchor="start">DISTRIBUIÇÃO PARA MODELOS LOCAIS (Camada 3):</text>
<text x="882" y="305" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• Pode distribuir tarefas ao Ollama local (DSH, Qwen,</text>
<text x="882" y="322" font-size="10.6" font-weight="bold" fill="#D55E00" text-anchor="start">  OpenCode) desde que o CÉREBRO demande a distribuição!</text>
