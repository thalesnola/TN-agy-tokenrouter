<text x="57" y="545" font-size="10.6" font-weight="bold" fill="#1a2230" text-anchor="start">Modelo: gpt-oss:20b</text>
<text x="57" y="562" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">Split: 59% CPU / 41% GPU (CTX 32768)</text>
