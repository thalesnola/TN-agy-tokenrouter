<text x="668" y="562" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">Agente: investigador (~2 min, 25 GB)</text>
<text x="668" y="579" font-size="10.6" font-weight="bold" fill="#1a2230" text-anchor="start">MCPs Exclusivos: rag + forense + LightRAG</text>
<text x="668" y="596" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">Escopo: Busca semântica/exata, timeline,</text>
<text x="668" y="613" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">  grafo de entidades (porta 9621)</text>
<text x="668" y="630" font-size="10.6" font-weight="bold" fill="#009E73" text-anchor="start">Saída: Síntese + proveniência (custódia)</text>
