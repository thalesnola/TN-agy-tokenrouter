<text x="57" y="175" font-size="11.8" font-weight="bold" fill="#1a2230" text-anchor="start">0. Guarda &amp; Segundo Cérebro</text>
<rect x="230.21492187500002" y="161" width="56.785078125" height="18" rx="3" fill="#D55E00" stroke="none"/>
<text x="258.60746093750004" y="173" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">PRE-FLIGHT</text>
<text x="57" y="203" font-size="10.6" font-weight="bold" fill="#1a2230" text-anchor="start">Hooks Nativos (~/.gemini/config):</text>
<text x="57" y="220" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• SessionStart: perfil-maquina.py</text>
<text x="57" y="237" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• PreInvocation: consultar.py (Vault)</text>
<text x="57" y="254" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• PreToolUse: guardar.py (bloqueia PII)</text>
<text x="57" y="271" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• Stop: auditar.py (zero vazamento)</text>
<text x="57" y="288" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">• Git Hook: instalar-hook-git.py</text>
<text x="57" y="305" font-size="10.6" font-weight="bold" fill="#D55E00" text-anchor="start">Grafo local: graphify query primeiro</text>
<text x="57" y="322" font-size="10.6" font-weight="bold" fill="#D55E00" text-anchor="start">Regra: Evidência original intocável</text>
