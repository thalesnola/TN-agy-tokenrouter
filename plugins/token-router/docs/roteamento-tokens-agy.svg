<text x="44" y="426" font-size="10.5" font-weight="normal" fill="#4a5364" text-anchor="start">Hardware: workstation 16 (Core Ultra 9 285H | 64 GB DDR5 | RTX PRO 1000 8 GB)  |  Regra Ollama: OLLAMA_NUM_PARALLEL=1 (em série) | CTX=32768 | FLASH_ATTN=1 | KV=q8_0</text>
