<text x="981" y="613" font-size="10.6" font-weight="bold" fill="#E69F00" text-anchor="start">Plano B (Bunker): claude-local / MCP</text>
<text x="981" y="630" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">  (hook StopFailure no fim de crédito)</text>
