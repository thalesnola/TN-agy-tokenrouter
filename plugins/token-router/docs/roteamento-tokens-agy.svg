<text x="355" y="562" font-size="10.6" font-weight="normal" fill="#4a5364" text-anchor="start">Split: 84% CPU / 16% GPU (UD-Q3_K_XL)</text>
<text x="355" y="579" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">Escopo: Lote mecânico &gt;= 5 arquivos</text>
<text x="355" y="596" font-size="10.6" font-weight="normal" fill="#1a2230" text-anchor="start">Piso: 2-4 min (~26k tokens preâmbulo)</text>
<text x="355" y="613" font-size="10.6" font-weight="bold" fill="#1a2230" text-anchor="start">Regra: Enviar lote inteiro num só prompt</text>
