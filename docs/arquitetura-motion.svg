<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1223" width="1000" height="1223" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEFF"/><stop offset="0.55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F7FF"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B5CFF" stop-opacity="0"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0.2"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1B1F3B" flood-opacity="0.16"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1B1F3B"/></marker>
</defs>
<rect width="1000" height="1223" fill="url(#bg)"/>
<circle cx="930" cy="110" r="160" fill="#FF7AC6" opacity="0.14" filter="url(#glow)"/>
<circle cx="70" cy="1093" r="180" fill="#2F9BFF" opacity="0.13" filter="url(#glow)"/>
<rect x="-60" y="513.66" width="700" height="28" rx="14" fill="url(#trail)" transform="rotate(-12 300 513.66)"/>
<rect x="520" y="1123" width="600" height="24" rx="12" fill="url(#trail)" transform="rotate(-12 800 1123)"/>
<line x1="92" y1="342.8" x2="92" y2="971.3000000000002" stroke="#7B5CFF" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.65"/><text x="50" y="85" font-size="42" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="50" dy="0">Cada tarefa desce ao menor modelo capaz</tspan><tspan x="50" dy="52">de resolvê-la</tspan></text><text x="52" y="177" font-size="24" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Arquitetura em escada do agy-tokenrouter — precisão máxima com</tspan><tspan x="52" dy="32">economia de cota</tspan></text><g filter="url(#sh)"><rect x="170" y="255" width="780" height="175.60000000000002" rx="24" fill="#fff"/><rect x="170" y="255" width="12" height="175.60000000000002" rx="6" fill="#7B5CFF"/></g><text x="202" y="302.25" font-size="25" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="202" dy="0">Camada 1 · Cérebro Orquestrador (Argon → Opus)</tspan></text><text x="202" y="339.1" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="202" dy="0">Analisa o pedido, define a arquitetura, decide trade-offs e</tspan><tspan x="202" dy="29.700000000000003">comanda a distribuição. Protegido contra leitura bruta (&gt; 3</tspan><tspan x="202" dy="29.700000000000003">arquivos) e saídas extensas.</tspan></text><g filter="url(#sh)"><rect x="170" y="454.6" width="780" height="205.3" rx="24" fill="#fff"/><rect x="170" y="454.6" width="12" height="205.3" rx="6" fill="#2F9BFF"/></g><text x="202" y="501.85" font-size="25" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="202" dy="0">Camada 2 · Agentes Rápidos (Flash 3.8 → Sonnet)</tspan></text><text x="202" y="538.7" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="202" dy="0">Varredura e leitura SEM LIMITE de tamanho de arquivo ou</tspan><tspan x="202" dy="29.700000000000003">número de linhas. Processa logs, CSVs e bases em contexto</tspan><tspan x="202" dy="29.700000000000003">isolado, devolve síntese de 1–3 parágrafos e despacha lotes</tspan><tspan x="202" dy="29.700000000000003">locais.</tspan></text><g filter="url(#sh)"><rect x="170" y="683.9000000000001" width="780" height="175.60000000000002" rx="24" fill="#fff"/><rect x="170" y="683.9000000000001" width="12" height="175.60000000000002" rx="6" fill="#16C79A"/></g><text x="202" y="731.1500000000001" font-size="25" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="202" dy="0">Camada 3 · Executores Locais Ollama (Custo Zero)</tspan></text><text x="202" y="768.0000000000001" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="202" dy="0">dsh-local (gpt-oss:20b, 1–4 arqs, ~70 s), qwen-local</tspan><tspan x="202" dy="29.700000000000003">(Qwen3-Coder-Next 36 GB, lote mecânico ≥ 5 arqs num único</tspan><tspan x="202" dy="29.700000000000003">prompt) e opencode-local (Nemotron 30B, RAG).</tspan></text><g filter="url(#sh)"><rect x="170" y="883.5000000000001" width="780" height="175.60000000000002" rx="24" fill="#fff"/><rect x="170" y="883.5000000000001" width="12" height="175.60000000000002" rx="6" fill="#FFB300"/></g><text x="202" y="930.7500000000001" font-size="25" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="202" dy="0">Camada 4 · Contingência Automática (HTTP 429)</tspan></text><text x="202" y="967.6000000000001" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="202" dy="0">Comutação imediata na escada de nuvem (Argon ↔ Opus), Plano</tspan><tspan x="202" dy="29.700000000000003">A via OmniRoute + RTK e Plano B em bunker 100% offline local</tspan><tspan x="202" dy="29.700000000000003">com ollama-router e claude-local.</tspan></text><circle cx="92" cy="342.8" r="50" fill="#7B5CFF" stroke="#fff" stroke-width="7" filter="url(#sh)"/><text x="92" y="357.8" font-size="42" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="92" dy="0">1</tspan></text><circle cx="92" cy="557.25" r="50" fill="#2F9BFF" stroke="#fff" stroke-width="7" filter="url(#sh)"/><text x="92" y="572.25" font-size="42" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="92" dy="0">2</tspan></text><circle cx="92" cy="771.7" r="50" fill="#16C79A" stroke="#fff" stroke-width="7" filter="url(#sh)"/><text x="92" y="786.7" font-size="42" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="92" dy="0">3</tspan></text><circle cx="92" cy="971.3000000000002" r="50" fill="#FFB300" stroke="#fff" stroke-width="7" filter="url(#sh)"/><text x="92" y="986.3000000000002" font-size="42" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="92" dy="0">4</tspan></text><g filter="url(#sh)"><rect x="50" y="1083.1000000000001" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="1126.1000000000001" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">A janela do cérebro nunca entope: leitura ilimitada na camada rápida</tspan><tspan x="500.0" dy="31.05">e lotes pesados no hardware local.</tspan></text>
</svg>